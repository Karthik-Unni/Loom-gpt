[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-gpt"
version = "0.1.0"
description = "Train specialist GPT models locally and blend them together with interpretable model weaving."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
]

[project.scripts]
loom = "loom:main"

[tool.setuptools]
py-modules = ["loom", "config"]

[tool.setuptools.packages.find]
include = ["src*"]
